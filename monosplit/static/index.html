<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>monosplit — split caller / agent</title>
<style>
  :root {
    --khach: #2563eb;
    --agent: #059669;
    --vien: #e2e8f0;
    --mo: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px;
    font: 15px/1.5 "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
    background: #f8fafc; color: #0f172a;
  }
  main { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .phu { color: var(--mo); margin: 0 0 24px; }
  section {
    background: #fff; border: 1px solid var(--vien); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  #tha {
    border: 2px dashed #cbd5e1; border-radius: 10px; padding: 32px;
    text-align: center; color: var(--mo); cursor: pointer; transition: .15s;
  }
  #tha.treo { border-color: var(--khach); background: #eff6ff; color: var(--khach); }
  #ten { color: #0f172a; font-weight: 600; }
  textarea {
    width: 100%; min-height: 64px; margin-top: 14px; padding: 8px 10px;
    border: 1px solid var(--vien); border-radius: 8px; font: inherit; resize: vertical;
  }
  .hang { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  button {
    background: var(--khach); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #94a3b8; cursor: default; }
  #trang-thai { color: var(--mo); }
  #trang-thai.loi { color: #dc2626; }
  h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mo); }
  .lan { position: relative; height: 40px; background: #f1f5f9; border-radius: 6px; margin-bottom: 6px; }
  .lan-ten { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .khoi {
    position: absolute; top: 5px; height: 30px; border-radius: 4px; min-width: 2px;
    color: #fff; font-size: 11px; line-height: 30px; overflow: hidden;
    padding: 0 4px; white-space: nowrap; cursor: default;
  }
  .khoi.caller { background: var(--khach); }
  .khoi.agent { background: var(--agent); }
  .truc { display: flex; justify-content: space-between; color: var(--mo); font-size: 12px; margin-top: 4px; }
  canvas { width: 100%; height: 90px; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--vien); vertical-align: top; }
  th { color: var(--mo); font-weight: 600; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  td.so { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .the { display: inline-block; padding: 1px 8px; border-radius: 999px; color: #fff; font-size: 12px; }
  .the.caller { background: var(--khach); }
  .the.agent { background: var(--agent); }
  .canh-bao { background: #fef3c7; border-left: 3px solid #f59e0b; padding: 8px 12px; border-radius: 4px; margin-top: 8px; }
  .an { display: none; }
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--mo); }
</style>
</head>
<body>
<main>
  <h1>monosplit</h1>
  <p class="phu">Split the caller and agent voices out of a single-channel call recording.</p>

  <section>
    <div id="tha">
      Drag a recording here, or click to pick a file<br>
      <span id="ten"></span>
    </div>
    <input id="chon" type="file" accept="audio/*,.m4a,.wav,.mp3,.ogg" hidden>
    <textarea id="yeu-cau" placeholder="Optional — one line per task the agent must do (helps pick the right role). Example: greet and state the hotline name"></textarea>
    <div class="hang">
      <button id="chay" disabled>Split voices</button>
      <span id="trang-thai"></span>
    </div>
  </section>

  <div id="ket-qua" class="an">
    <section>
      <h2>Timeline</h2>
      <div class="lan-ten" style="color:var(--khach)">Caller</div>
      <div class="lan" id="lan-caller"></div>
      <div class="lan-ten" style="color:var(--agent)">Agent</div>
      <div class="lan" id="lan-agent"></div>
      <div class="truc"><span>0:00</span><span id="het"></span></div>
    </section>

    <section>
      <h2>Waveform</h2>
      <canvas id="song" height="180"></canvas>
    </section>

    <section>
      <h2>Evidence &amp; warnings</h2>
      <dl>
        <dt>Source</dt><dd id="nguon"></dd>
        <dt>Route</dt><dd id="mode"></dd>
        <dt>Role choice</dt><dd id="ly-do"></dd>
      </dl>
      <div id="canh-bao"></div>
    </section>

    <section>
      <h2>Turn table</h2>
      <table>
        <thead><tr>
          <th>#</th><th>Role</th><th>Start</th><th>End</th><th>Length</th><th>Margin</th><th>Text</th>
        </tr></thead>
        <tbody id="bang"></tbody>
      </table>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const VAI = { caller: "Caller", agent: "Agent" };
let tep = null;

const dongHo = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}.${String(Math.floor(ms % 1000 / 100))}`;

// --- file pick: drag-and-drop and click both land in the same place ---
const tha = $("tha");
tha.onclick = () => $("chon").click();
$("chon").onchange = (e) => nhan(e.target.files[0]);
tha.ondragover = (e) => { e.preventDefault(); tha.classList.add("treo"); };
tha.ondragleave = () => tha.classList.remove("treo");
tha.ondrop = (e) => { e.preventDefault(); tha.classList.remove("treo"); nhan(e.dataTransfer.files[0]); };

function nhan(f) {
  if (!f) return;
  tep = f;
  $("ten").textContent = `${f.name} — ${(f.size / 1048576).toFixed(1)} MB`;
  $("chay").disabled = false;
  $("trang-thai").textContent = "";
}

// --- call the API ---
$("chay").onclick = async () => {
  if (!tep) return;
  $("chay").disabled = true;
  const tt = $("trang-thai");
  tt.className = "";
  tt.textContent = "Splitting voices and transcribing, this may take a while…";
  const form = new FormData();
  form.append("file", tep);
  form.append("requirements", $("yeu-cau").value);
  try {
    const res = await fetch("/api/separate", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) {
      const chi = data.detail || {};
      throw new Error(chi.message || JSON.stringify(chi));
    }
    ve(data);
    tt.textContent = `Done — ${data.turns.length} turns.`;
  } catch (err) {
    tt.className = "loi";
    tt.textContent = `Error: ${err.message}`;
  } finally {
    $("chay").disabled = false;
  }
};

// --- render the result ---
function ve(d) {
  // Drop the hidden class BEFORE drawing: a canvas inside a display:none block
  // has zero width, so the waveform would come out blank.
  $("ket-qua").classList.remove("an");
  const tong = Math.max(d.duration_ms, ...d.turns.map((t) => t.end_ms), 1);
  $("het").textContent = dongHo(tong);
  $("nguon").textContent = `${d.source} — ${(d.duration_ms / 1000).toFixed(1)}s, ${d.channels} channels`;
  $("mode").textContent = d.mode;
  $("ly-do").textContent = d.role_reason || "—";

  const cb = $("canh-bao");
  cb.innerHTML = "";
  const canh = [...(d.warnings || [])];
  // the pipeline already adds its own "one voice" warning — only add ours when
  // that one is absent, two near-identical lines just leave the reader guessing.
  if (d.same_voice && !canh.some((c) => c.includes("one voice"))) {
    canh.push("Both sides sound like one voice — labels are assigned alternately per turn, verify by ear.");
  }
  // Suspected overlap: report the COUNT and the TIMESTAMPS, do not sum them into
  // a total in seconds — the model's boundaries are fuzzy to ±62 ms, so a total
  // looks more precise than the truth.
  const VAI_VN = { caller: "Caller", agent: "Agent" };
  for (const o of d.overlaps || []) {
    const huong = VAI_VN[o.who_cut_in] ? ` — ${VAI_VN[o.who_cut_in]} cut in` : "";
    canh.push(`Suspected overlap at ${(o.start_ms / 1000).toFixed(1)}s${huong} (inferred, not measured).`);
  }
  for (const c of canh) {
    const div = document.createElement("div");
    div.className = "canh-bao";
    div.textContent = c;
    cb.appendChild(div);
  }

  for (const vai of ["caller", "agent"]) $(`lan-${vai}`).innerHTML = "";
  const bang = $("bang");
  bang.innerHTML = "";

  d.turns.forEach((t, i) => {
    const khoi = document.createElement("div");
    khoi.className = `khoi ${t.speaker}`;
    khoi.style.left = `${(t.start_ms / tong) * 100}%`;
    khoi.style.width = `${Math.max((t.duration_ms / tong) * 100, 0.3)}%`;
    khoi.title = `${VAI[t.speaker]} ${dongHo(t.start_ms)}–${dongHo(t.end_ms)}\n${t.text || "(no text)"}`;
    khoi.textContent = t.text || String(i + 1);
    $(`lan-${t.speaker}`).appendChild(khoi);

    const tr = document.createElement("tr");
    for (const [lop, noi] of [
      ["so", String(i + 1)],
      ["", null],
      ["so", dongHo(t.start_ms)],
      ["so", dongHo(t.end_ms)],
      ["so", `${(t.duration_ms / 1000).toFixed(2)}s`],
      ["so", t.margin.toFixed(3)],
      ["", t.text],
    ]) {
      const td = document.createElement("td");
      td.className = lop;
      if (noi === null) {
        const the = document.createElement("span");
        the.className = `the ${t.speaker}`;
        the.textContent = VAI[t.speaker] || t.speaker;
        td.appendChild(the);
      } else td.textContent = noi;
      tr.appendChild(td);
    }
    bang.appendChild(tr);
  });

  veSong(d);
}

function veSong(d) {
  const cv = $("song");
  const w = cv.clientWidth, h = 180;
  cv.width = w * 2; // draw at double resolution so it stays crisp on HiDPI screens
  cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, h);
  const song = d.waveform || [];
  if (!song.length) return;

  // Each screen column merges several frames: take the peak, not the average, so
  // a short sound is not flattened away.
  const cot = cv.width;
  const buoc = song.length / cot;
  const khung = d.waveform_frame_ms || 20;
  const giua = h / 2;
  for (let x = 0; x < cot; x++) {
    let dinh = 0;
    for (let k = Math.floor(x * buoc); k < Math.min(song.length, Math.floor((x + 1) * buoc) + 1); k++) {
      if (song[k] > dinh) dinh = song[k];
    }
    const ms = (x * buoc) * khung;
    const luot = d.turns.find((t) => ms >= t.start_ms && ms < t.end_ms);
    ctx.fillStyle = luot ? (luot.speaker === "agent" ? "#059669" : "#2563eb") : "#cbd5e1";
    const cao = Math.max(1, (dinh / 32768) * (h - 8));
    ctx.fillRect(x, giua - cao / 2, 1, cao);
  }
}
</script>
</body>
</html>
