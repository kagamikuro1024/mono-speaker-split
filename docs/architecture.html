<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monosplit — splitting caller / agent on one channel</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #0a0a0a;
      --color-muted:  #525252;
      --color-accent: #e7000b;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · monosplit</p>
    <h1>Splitting caller / agent on a single-channel recording</h1>

    <svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">The monosplit pipeline</title>
      <desc id="architecture-desc">A single-channel recording goes through a true-stream check, a speech-run detection step, then three role-assignment layers: blind clustering knows when the speaker changes, the text-based role layer decides who is the caller and who is the agent, the voice-embedding layer rescores each run; transcription is an optional branch that feeds evidence to layer two, and an optional separator step recovers the words spoken inside overlaps of 400 ms or more.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525252"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e7000b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2b7fa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- ── connectors drawn before the boxes so the strokes run behind them ── -->
      <line x1="240" y1="88" x2="280" y2="88" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="88" x2="520" y2="88" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="88" x2="760" y2="88" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <path d="M 620,128 V 148 Q 620,156 612,156 H 148 Q 140,156 140,164 V 216"
            fill="none" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 860,128 V 188 Q 860,196 852,196 H 388 Q 380,196 380,204 V 216"
            fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="240" y1="256" x2="280" y2="256" stroke="#e7000b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="480" y1="256" x2="520" y2="256" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="256" x2="760" y2="256" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- connector labels: paper mask, leaving 8px above the stroke -->
      <rect x="336" y="136" width="88" height="12" rx="2" fill="#fafafa"/>
      <text x="380" y="145" fill="#737373" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPEECH RUNS</text>
      <rect x="568" y="176" width="104" height="12" rx="2" fill="#fafafa"/>
      <text x="620" y="185" fill="#737373" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEXT + WORD TIMES</text>

      <!-- ── top row: read the file, check the streams, detect speech, transcribe ── -->
      <rect x="40" y="48" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="40" y="48" width="200" height="80" rx="6" fill="rgba(10,10,10,0.04)" stroke="#737373" stroke-width="1"/>
      <rect x="48" y="56" width="44" height="14" rx="2" fill="none" stroke="rgba(115,115,115,0.50)" stroke-width="0.8"/>
      <text x="70" y="66" fill="#737373" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="140" y="96" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Single-channel recording</text>
      <text x="140" y="112" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wav · m4a · mp3</text>

      <rect x="280" y="48" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="280" y="48" width="200" height="80" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="288" y="56" width="44" height="14" rx="2" fill="none" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="310" y="66" fill="#0a0a0a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
      <text x="380" y="96" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One stream or two?</text>
      <text x="380" y="112" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">true 2-ch → stop, no guessing</text>

      <rect x="520" y="48" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="520" y="48" width="200" height="80" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="528" y="56" width="44" height="14" rx="2" fill="none" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="550" y="66" fill="#0a0a0a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VAD</text>
      <text x="620" y="96" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detect speech runs</text>
      <text x="620" y="112" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">20 ms frames · ≥ 200 ms</text>

      <rect x="760" y="48" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="760" y="48" width="200" height="80" rx="6" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="768" y="56" width="44" height="14" rx="2" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="0.8"/>
      <text x="790" y="66" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASR</text>
      <text x="860" y="96" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transcription (optional)</text>
      <text x="860" y="112" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">faster-whisper · word times</text>

      <!-- ── bottom row: three role-assignment layers, then the result ── -->
      <rect x="40" y="216" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="40" y="216" width="200" height="80" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="48" y="224" width="52" height="14" rx="2" fill="none" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="74" y="234" fill="#0a0a0a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAYER 1</text>
      <text x="140" y="264" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blind clustering</text>
      <text x="140" y="280" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pyannote seg 3.0 · 2 clusters</text>

      <rect x="280" y="216" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="280" y="216" width="200" height="80" rx="6" fill="rgba(231,0,11,0.08)" stroke="#e7000b" stroke-width="1"/>
      <rect x="288" y="224" width="52" height="14" rx="2" fill="none" stroke="rgba(231,0,11,0.50)" stroke-width="0.8"/>
      <text x="314" y="234" fill="#e7000b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAYER 2</text>
      <text x="380" y="264" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pick the role by TEXT</text>
      <text x="380" y="280" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read-back value · agent phrases</text>

      <rect x="520" y="216" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="520" y="216" width="200" height="80" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="528" y="224" width="52" height="14" rx="2" fill="none" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="554" y="234" fill="#0a0a0a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAYER 3</text>
      <text x="620" y="264" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Voice embedding rescore</text>
      <text x="620" y="280" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ERes2Net · cosine ≥ 0.10</text>

      <rect x="760" y="216" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="760" y="216" width="200" height="80" rx="6" fill="rgba(10,10,10,0.05)" stroke="#525252" stroke-width="1"/>
      <rect x="768" y="224" width="44" height="14" rx="2" fill="none" stroke="rgba(82,82,82,0.50)" stroke-width="0.8"/>
      <text x="790" y="234" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="860" y="264" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turns with role labels</text>
      <text x="860" y="280" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">caller / agent · margin</text>

      <!-- ── optional fourth step: recover the words lost inside an overlap ── -->
      <!-- Dashed, like ASR: without a separator model the run still finishes,
           it just reports the overlap without any words. -->
      <path d="M 620 296 L 620 316" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
      <text x="632" y="310" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">OVERLAPS &#8805; 400 MS</text>

      <rect x="520" y="320" width="200" height="80" rx="6" fill="#fafafa"/>
      <rect x="520" y="320" width="200" height="80" rx="6" fill="#ffffff" stroke="#525252" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="528" y="328" width="88" height="14" rx="2" fill="none" stroke="rgba(82,82,82,0.50)" stroke-width="0.8"/>
      <text x="572" y="338" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
      <text x="620" y="368" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One channel per role</text>
      <text x="620" y="384" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SepFormer 16 kHz &#183; re-read turns</text>

      <path d="M 720 360 L 860 360 L 860 300" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
      <text x="790" y="354" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURNS RE-READ</text>
      <!-- ── legend: horizontal strip at the bottom ── -->
      <line x1="40" y1="424" x2="960" y2="424" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>
      <text x="40" y="444" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="440" x2="168" y2="440" stroke="#e7000b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="176" y="444" fill="#525252" font-size="9" font-family="'Geist Mono', monospace">red = only place deciding who is who</text>

      <line x1="424" y1="440" x2="452" y2="440" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="460" y="444" fill="#525252" font-size="9" font-family="'Geist Mono', monospace">dashed = optional, runs without it</text>

      <line x1="712" y1="440" x2="740" y2="440" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="748" y="444" fill="#525252" font-size="9" font-family="'Geist Mono', monospace">solid = the main path</text>
    </svg>
  </div>
</body>
</html>
