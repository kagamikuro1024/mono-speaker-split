[project]
name = "monosplit"
version = "0.1.0"
description = "Split caller / agent apart from a single-channel call recording — three layers, CPU-only, no PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    # sherpa-onnx: pyannote segmentation 3.0 + ERes2Net voice embedding, both
    # running on onnxruntime. A few MB of wheel, does NOT pull in PyTorch.
    "sherpa-onnx>=1.13",
    # Native library that `sherpa-onnx` loads at import time. Dev machines usually
    # already have it, so it is easy to forget; without it `import sherpa_onnx`
    # dies with "libonnxruntime.so: cannot open shared object file".
    "sherpa-onnx-core>=1.13",
]

[project.optional-dependencies]
# Transcription. Without it roles are still separated, only the turns carry no text — and
# layer 2 (text picks the role) loses its evidence and falls back to inferring from turn order.
asr = ["faster-whisper>=1.1"]
# Web UI.
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
monosplit = "monosplit.cli:main"

[project.urls]
Source = "https://github.com/kagamikuro1024/mono-speaker-split"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monosplit"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
